basePath: /
definitions:
  handlers.HealthResponse:
    properties:
      service:
        type: string
      status:
        type: string
      timestamp:
        type: string
      version:
        type: string
    type: object
  models.Alert:
    properties:
      created_at:
        type: string
      id:
        type: string
      message:
        type: string
      severity:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  models.Metric:
    properties:
      cpu_usage:
        type: number
      created_at:
        type: string
      disk_usage:
        type: number
      id:
        type: string
      memory_usage:
        type: number
      network_in:
        type: number
      network_out:
        type: number
      timestamp:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: API de monitoreo cloud con IA
  title: CloudPulse AI API
  version: "1.0"
paths:
  /api/v1/alerts:
    get:
      description: Obtiene todas las alertas
      parameters:
      - description: Filtrar por severidad
        in: query
        name: severity
        type: string
      - description: Filtrar por estado
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Listar alertas
      tags:
      - alerts
    post:
      consumes:
      - application/json
      description: Crea una nueva alerta del sistema
      parameters:
      - description: Datos de la alerta
        in: body
        name: alert
        required: true
        schema:
          $ref: '#/definitions/models.Alert'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Alert'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Crear alerta
      tags:
      - alerts
  /api/v1/alerts/{id}:
    put:
      consumes:
      - application/json
      description: Actualiza una alerta existente
      parameters:
      - description: ID de la alerta
        in: path
        name: id
        required: true
        type: string
      - description: Datos a actualizar
        in: body
        name: alert
        required: true
        schema:
          $ref: '#/definitions/models.Alert'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Alert'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Actualizar alerta
      tags:
      - alerts
  /api/v1/metrics:
    get:
      description: Obtiene todas las métricas
      parameters:
      - description: Máximo de resultados
        in: query
        name: limit
        type: integer
      - description: Saltar N resultados
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Listar métricas
      tags:
      - metrics
    post:
      consumes:
      - application/json
      description: Crea una nueva métrica de monitoreo
      parameters:
      - description: Datos de la métrica
        in: body
        name: metric
        required: true
        schema:
          $ref: '#/definitions/models.Metric'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Metric'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Crear métrica
      tags:
      - metrics
  /api/v1/metrics/{id}:
    delete:
      description: Elimina una métrica por ID
      parameters:
      - description: ID de la métrica
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Eliminar métrica
      tags:
      - metrics
    get:
      description: Obtiene una métrica por ID
      parameters:
      - description: ID de la métrica
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Metric'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Obtener métrica
      tags:
      - metrics
  /health:
    get:
      description: Devuelve el estado de la API
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
      summary: Verificar estado del servicio
      tags:
      - health
swagger: "2.0"
