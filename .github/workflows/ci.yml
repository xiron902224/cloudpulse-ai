# ============================================
# CI/CD for CloudPulse AI
# ============================================

name: CI/CD

# When does it run?
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Jobs to run
jobs:
  # ---------- 1. GO TEST ----------
  test-go:
    name: Test Go API
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Download dependencies
        working-directory: services/api-go
        run: go mod download
      
      - name: Run tests
        working-directory: services/api-go
        run: go test ./... -v -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: services/api-go/coverage.out
          flags: go
          fail_ci_if_error: false
      
      - name: Check formatting
        working-directory: services/api-go
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "❌ Unformatted code:"
            gofmt -l .
            exit 1
          fi

  # ---------- 2. RUST TEST ----------
  test-rust:
    name: Test Rust Collector
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      
      - name: Run tests
        working-directory: services/collector-rust
        run: cargo test --verbose
      
      - name: Check formatting
        working-directory: services/collector-rust
        run: cargo fmt -- --check
      
      - name: Linter (clippy)
        working-directory: services/collector-rust
        run: cargo clippy -- -D warnings

  # ---------- 3. FRONTEND TEST ----------
  test-frontend:
    name: Test React Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Run tests
        working-directory: frontend
        run: npm test -- --passWithNoTests
      
      - name: Linter
        working-directory: frontend
        run: npm run lint --if-present
      
      - name: Build
        working-directory: frontend
        run: npm run build

  # ---------- 4. DOCKER BUILD ----------
  build-docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [test-go, test-rust, test-frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build images
        run: docker-compose build
      
      - name: Check images
        run: docker images

