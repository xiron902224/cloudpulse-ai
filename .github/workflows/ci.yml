# ============================================
# CI/CD para CloudPulse AI
# ============================================

name: CI/CD

# ¿Cuándo se ejecuta?
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Trabajos a ejecutar
jobs:
  # ---------- 1. TEST DE GO ----------
  test-go:
    name: Test Go API
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Descargar dependencias
        working-directory: services/api-go
        run: go mod download
      
      - name: Ejecutar tests
        working-directory: services/api-go
        run: go test ./... -v
      
      - name: Verificar formato
        working-directory: services/api-go
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "❌ Código sin formatear:"
            gofmt -l .
            exit 1
          fi

  # ---------- 2. TEST DE RUST ----------
  test-rust:
    name: Test Rust Collector
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      
      - name: Ejecutar tests
        working-directory: services/collector-rust
        run: cargo test --verbose
      
      - name: Verificar formato
        working-directory: services/collector-rust
        run: cargo fmt -- --check
      
      - name: Linter (clippy)
        working-directory: services/collector-rust
        run: cargo clippy -- -D warnings

  # ---------- 3. TEST DE FRONTEND ----------
  test-frontend:
    name: Test React Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      
      - name: Ejecutar tests
        working-directory: frontend
        run: npm test -- --passWithNoTests
      
      - name: Linter
        working-directory: frontend
        run: npm run lint --if-present
      
      - name: Build
        working-directory: frontend
        run: npm run build

  # ---------- 4. BUILD DE DOCKER ----------
  build-docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [test-go, test-rust, test-frontend]
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Build imágenes
        run: docker-compose build
      
      - name: Verificar imágenes
        run: docker images

  # ---------- 5. DEPLOY (opcional) ----------
